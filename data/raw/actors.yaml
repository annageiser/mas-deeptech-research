# Swiss quantum-computing ecosystem actors.
#
# Inventory drawn from the disposition's "Actors" box and the Switzerland Hub
# Quantum report (swissnex, 2025). Forty actors across five categories. The
# homepage and arxiv_query fields are best-effort starting points — both
# systems may discover better URLs / search strings at runtime and propose
# updates back to this file.

actors:
  # ---------- National Initiatives (Headquarters) ----------
  - slug: swiss-quantum-initiative
    name: Swiss Quantum Initiative
    category: national_initiative
    homepage: https://quantum.scnat.ch/en

  - slug: nccr-spin
    name: National Centre for Competence in Research SPIN
    category: national_initiative
    homepage: https://nccr-spin.ch

  - slug: metas
    name: Federal Institute of Metrology (METAS)
    category: national_initiative
    homepage: https://www.metas.ch

