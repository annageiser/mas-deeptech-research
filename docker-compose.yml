# Docker Compose stack for the BSc-thesis comparative MAS (Anna Geiser, FHNW).
#
# Five containers, one VPS, one Supabase:
#   A — masfactory : System A scrape (cron-driven)
#   B — hermes     : System B scrape (cron-driven)
#   C — reports    : daily + weekly markdown synthesis (cron-driven)
#   D — dashboard  : Streamlit web UI on :8501 (continuously running)
#   E — caddy      : TLS reverse proxy on :80 / :443 (continuously running)
#
# Internal Docker network: A, B, C exit after their run (cron-driven). D and
# E stay up so the public dashboard is always reachable at
# mas-deeptech-research.cloud.

services:
  masfactory:
    build:
      context: ./systems/masfactory
      dockerfile: Dockerfile
    image: mas-deeptech-research/masfactory:0.1.0
    container_name: masfactory-system-a
    restart: "no"
    env_file:
      - .env
    environment:
      MASF_AUDIT_DIR: /data/raw/runs
      TZ: Europe/Zurich
    volumes:
      - ./data:/data
    command: ["run-once"]

  hermes:
    build:
      context: ./systems/hermes
      dockerfile: Dockerfile
    image: mas-deeptech-research/hermes:0.1.0
    container_name: hermes-system-b
    restart: "no"
    env_file:
      - .env
    environment:
      HRM_AUDIT_DIR: /data/raw/runs
      HRM_SKILLS_DIR: /app/skills
      HRM_MEMORY_PATH: /data/raw/hermes_memory.sqlite
      HRM_WEB_CACHE_DIR: /data/raw/hermes_web_cache
      TZ: Europe/Zurich
    volumes:
      - ./data:/data
    command: ["run-once"]

  reports:
    build:
      context: ./systems/reports
      dockerfile: Dockerfile
    image: mas-deeptech-research/reports:0.1.0
    container_name: reports-container-c
    restart: "no"
    env_file:
      - .env
    environment:
      RPT_REPORTS_DIR: /data/reports
      RPT_REPO_DIR: /repo
      RPT_THESIS_NOTES_PATH: /data/raw/thesis_notes.md
      TZ: Europe/Zurich
    volumes:
      - ./data:/data
      - .:/repo:ro
    command: ["build-check"]

  dashboard:
    build:
      context: ./systems/dashboard
      dockerfile: Dockerfile
    image: mas-deeptech-research/dashboard:0.1.0
    container_name: dashboard-container-d
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DASH_REPORTS_DIR: /data/reports
      TZ: Europe/Zurich
    volumes:
      - ./data:/data:ro       # reports + actors.yaml, read-only
    expose:
      - "8501"
    ports:
      - "8501:8501"           # direct HTTP access at http://<vps-ip>:8501
                              # (Caddy still proxies HTTPS via the domain once DNS resolves)

  caddy:
    image: caddy:2.10-alpine
    container_name: caddy-container-e
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"        # HTTP/3 (QUIC)
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      TZ: Europe/Zurich

volumes:
  caddy_data:    # persists Let's Encrypt certs across container restarts
  caddy_config:
