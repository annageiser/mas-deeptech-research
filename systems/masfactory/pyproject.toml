[project]
name = "masfactory_system"
version = "0.1.0"
description = "System A — MASFactory-orchestrated multi-agent system for Swiss-quantum ecosystem signal harvesting (BSc thesis, Anna Geiser)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "masfactory==1.0.3",
    "supabase>=2.7.0",
    "httpx>=0.27.0",
    "selectolax>=0.3.21",
    "tenacity>=8.2.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.7.0",
    "python-dateutil>=2.9.0",
    "feedparser>=6.0.11",
    "urllib3>=2.2.0",
    # Embeddings (optional at runtime — gated by MASF_EMBEDDINGS=1).
    # ONNX-based, no torch dependency. ~80MB native lib + ~210MB model
    # cached on first use. See masfactory_system/embedding.py.
    "fastembed>=0.4.0",
    # v0.4.22: structured-output discipline at the Classifier/Persistence
    # boundary. The validate-only path uses pydantic directly; the LLM-repair
    # path (gated by MASF_INSTRUCTOR_REPAIR=1) uses instructor to re-prompt
    # OpenRouter when a candidate fails ClassifiedSignal validation.
    "instructor>=1.6.0",
    # v0.4.24: VADER sentiment scoring (Hutto & Gilbert 2014). Tiny lexicon,
    # no model download. Default ON; opt out with MASF_SENTIMENT=0.
    "vaderSentiment>=3.3.2",
    # v0.4.25: Phoenix observability — ship LLM-call traces to a local
    # Phoenix server so we can replay them in the UI. Off by default;
    # turn on with PHOENIX_ENABLED=1. The two packages combine to:
    #   - arize-phoenix-otel: OTLP exporter + register() helper
    #   - openinference-instrumentation-openai: auto-instruments the
    #     openai SDK that MASFactory's LegacyOpenAIModel uses under the hood
    "arize-phoenix-otel>=0.6.0",
    "openinference-instrumentation-openai>=0.1.18",
]

[project.scripts]
masfactory-run = "masfactory_system.runner:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["masfactory_system*"]

[tool.setuptools.package-data]
# `persistence/*.sql` does NOT match the migrations subdirectory -- an
# unanchored glob is per-directory. Both are listed explicitly so the
# hand-run migrations ship with the package and stay reachable from an
# installed environment (CI installs the wheel, not the checkout).
masfactory_system = [
    "classification/*.yaml",
    "persistence/*.sql",
    "persistence/migrations/*.sql",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
