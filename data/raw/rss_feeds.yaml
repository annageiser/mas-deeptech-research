# Central RSS feed registry — used by BOTH systems (MASFactory's
# FeedDiscoveryAgent + Hermes' rss_search tool). Comparative-validity
# invariant kept: same inputs to both systems.
#
# Each entry:
#   - name      : human-readable label (shown in audit folders)
#   - url       : RSS / Atom feed URL
#   - tags      : free-form metadata for filtering
#   - groups    : which actor-match strategy to use:
#       industry: entries are surfaced as documents for ANY actor whose
#                 name (or alias) appears in the entry title/summary
#       vendor:   entries are pre-attributed to one specific actor_slug
#                 (set the `actor_slug` field below)
#
# Hand-edit freely. The collector reads this file at runtime on every
# scrape, so a new feed appears in the next cron tick.

industry:
  # The Quantum Insider is the canonical serious-industry-blog source.
  # Reviewed 2026-06-11: daily cadence, named editors, accurate factual
  # reporting. Anna verified the source for thesis use. v0.4.19 also
  # enables the Hermes `blogwatcher` skill so the agent picks this feed
  # up via the upstream's RSS tooling, not just MASFactory's rss.py.
  - name: "The Quantum Insider — Daily"
    url: "https://thequantuminsider.com/feed/"
    tags: [news, daily, industry, vetted-by-anna]

  - name: "Phys.org — Quantum Physics"
    url: "https://phys.org/rss-feed/physics-news/quantum-physics/"
    tags: [news, science]

  - name: "Nature — Quantum information"
    url: "https://www.nature.com/subjects/quantum-information.rss"
    tags: [science, journal]

  - name: "Science Daily — Quantum Physics"
    url: "https://www.sciencedaily.com/rss/matter_energy/quantum_physics.xml"
    tags: [news, science]

swiss_media:
  - name: "Innovation Origins — Quantum"
    url: "https://innovationorigins.com/en/topic/quantum/feed/"
    tags: [european, news]
  # NOTE: SwissInfo's sci-tech RSS returned 404 in 2026-06-04 testing.
  # Re-curate when a working Swiss-domestic quantum feed is identified.

vendor:
  # Per-vendor blog feeds — entries are pre-attributed to actor_slug below.
  # Add an entry here when an actor publishes an RSS-enabled blog and you
  # want every post attributed to them automatically.
  # NOTE: each URL was verified live on 2026-06-04. If a vendor changes
  # their CMS, the feed may 404 — the collector silently skips bad feeds
  # so this isn't fatal, just a coverage gap until you re-curate.
  - name: "Quantinuum Blog"
    url: "https://www.quantinuum.com/news/feed"
    actor_slug: "quantinuum"
    tags: [vendor, blog]

# Defense / dual-use coverage — most defense outlets paywall their RSS.
# Left as an empty list rather than broken URLs; populate when a free
# defense-quantum feed is identified.
defense: []
