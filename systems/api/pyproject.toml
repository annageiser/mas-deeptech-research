[project]
name = "api_app"
version = "0.1.0"
description = "FastAPI JSON service over the shared Supabase signal database. Exposes the literature-grounded scoring (impact, credibility, cheap-talk ratio, authority) for the Next.js frontend and the thesis evaluation scripts. Read-only."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "supabase>=2.7.0",
    "pandas>=2.2.0",
    "networkx>=3.3",
    "pyyaml>=6.0.2",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "httpx>=0.27.0"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["api_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
