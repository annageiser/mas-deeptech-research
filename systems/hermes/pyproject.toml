[project]
name = "hermes_system"
version = "0.1.0"
description = "System B — Hermes-pattern single-agent runner for Swiss-quantum ecosystem mapping (BSc thesis, Anna Geiser). Follows the Nous Research Hermes design (long-running AIAgent loop + procedural memory + agentskills.io-format SKILL.md files) without depending on the heavy hermes-agent CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50.0",
    "supabase>=2.7.0",
    "httpx>=0.27.0",
    "selectolax>=0.3.21",
    "tenacity>=8.2.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.7.0",
    "python-dateutil>=2.9.0",
    "feedparser>=6.0.11",
    "urllib3>=2.2.0",
    # Optional embeddings (gated by HRM_EMBEDDINGS=1). See hermes_system/embedding.py.
    "fastembed>=0.4.0",
]

[project.scripts]
hermes-run = "hermes_system.runner:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hermes_system*"]

[tool.setuptools.package-data]
hermes_system = ["persistence/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
