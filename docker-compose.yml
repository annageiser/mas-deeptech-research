# Docker Compose stack for the BSc-thesis comparative MAS (Anna Geiser, FHNW).
#
# Mirrors the architecture diagram + reports synthesis layer:
#   Container A — MASFactory (System A)         — daily scrape (signals into Supabase)
#   Container B — Hermes-pattern agent (B)      — daily scrape (signals into Supabase)
#   Container C — Reports synthesizer            — daily + weekly markdown reports
#
# All three containers share .env (OpenRouter key + Supabase URL/key) and
# the same `./data` host bind-mount, so:
#   - the actors list lives once at data/raw/actors.yaml
#   - per-run audit folders land in data/raw/runs/<iso-ts>__<system>/
#   - both systems write to the same Supabase tables, distinguished by
#     runs.system in ('masfactory','hermes')
#   - reports land in data/reports/{daily,weekly,thesis}/...
#
# Container C is a synthesis layer — it reads what A and B produced and
# writes markdown briefings. It does NOT influence either system's outputs,
# so the comparative validity of A vs B is preserved.

services:
  masfactory:
    build:
      context: ./systems/masfactory
      dockerfile: Dockerfile
    image: mas-deeptech-research/masfactory:0.1.0
    container_name: masfactory-system-a
    restart: "no"          # cron drives invocations; the container exits after each run
    env_file:
      - .env
    environment:
      MASF_AUDIT_DIR: /data/raw/runs
      TZ: Europe/Zurich
    volumes:
      - ./data:/data
    command: ["run-once"]

  hermes:
    build:
      context: ./systems/hermes
      dockerfile: Dockerfile
    image: mas-deeptech-research/hermes:0.1.0
    container_name: hermes-system-b
    restart: "no"
    env_file:
      - .env
    environment:
      HRM_AUDIT_DIR: /data/raw/runs
      HRM_SKILLS_DIR: /app/skills
      HRM_MEMORY_PATH: /data/raw/hermes_memory.sqlite
      HRM_WEB_CACHE_DIR: /data/raw/hermes_web_cache
      TZ: Europe/Zurich
    volumes:
      - ./data:/data
    command: ["run-once"]

  reports:
    build:
      context: ./systems/reports
      dockerfile: Dockerfile
    image: mas-deeptech-research/reports:0.1.0
    container_name: reports-container-c
    restart: "no"
    env_file:
      - .env
    environment:
      RPT_REPORTS_DIR: /data/reports
      RPT_REPO_DIR: /repo            # mount the repo so weekly-thesis can read git log
      RPT_THESIS_NOTES_PATH: /data/raw/thesis_notes.md
      TZ: Europe/Zurich
    volumes:
      - ./data:/data
      - .:/repo:ro                   # the whole repo, read-only, for git log
    command: ["build-check"]
