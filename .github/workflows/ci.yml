# Continuous integration — runs every push + every PR against main / dev.
#
# Three jobs, all of which must pass:
#   1. python-tests : pytest in each of the 5 Python systems
#   2. web-typecheck : tsc --noEmit on the Next.js frontend
#   3. docker-builds : exercise each Dockerfile's build-time selfcheck
#
# Engineering-discipline signal for the BSc-thesis examiner: every commit
# on the repo's history has passed these gates. Cited in §3.5.4 of the
# thesis as the "reproducibility" leg of the empirical evaluation
# (Kasanen, Lukka & Siitonen 1993 — reproducibility designed in, not
# bolted on).

name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  python-tests:
    name: pytest — ${{ matrix.system }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: masfactory
            path: systems/masfactory
          # hermes wraps the upstream NousResearch hermes-agent docker image,
          # but our wrapper scripts (persist_signals.py, training_layer.py)
          # are Python and carry the load-bearing v0.4.38 reasoning-token
          # strip cited by name in thesis §3.4. Minimal pyproject + tests
          # added in P2-C; full container build still exercised below.
          - system: hermes
            path: systems/hermes
          - system: reports
            path: systems/reports
          - system: api
            path: systems/api
          - system: dashboard
            path: systems/dashboard
          - system: evaluation
            path: systems/evaluation

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ${{ matrix.system }} + test deps
        working-directory: ${{ matrix.path }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pytest

      - name: Run pytest
        working-directory: ${{ matrix.path }}
        run: pytest -q

  web-typecheck:
    name: tsc --noEmit (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: systems/web/package-lock.json

      - name: npm ci
        working-directory: systems/web
        run: npm ci --no-audit --no-fund --include=dev

      - name: TypeScript check
        working-directory: systems/web
        run: npx tsc --noEmit

  docker-builds:
    name: Docker build-check (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: masfactory
            context: ./systems/masfactory
            dockerfile: Dockerfile
          - image: hermes
            context: ./systems/hermes
            dockerfile: Dockerfile
          - image: reports
            context: ./systems/reports
            dockerfile: Dockerfile
          - image: api
            context: .
            dockerfile: systems/api/Dockerfile
          - image: web
            context: ./systems/web
            dockerfile: Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Each system's Dockerfile runs a build-time selfcheck (graph compiles,
      # schema parses, prompts render, tsc passes). A green build here is
      # the same selfcheck the VPS would run on deploy.
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile == 'Dockerfile' && 'Dockerfile' || matrix.dockerfile }}
          push: false
          load: false
          tags: mas-deeptech-research/${{ matrix.image }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
