# Hermes Agent — configuration for the Swiss-quantum signal-collection
# cron job. Mounted into the container at $HERMES_HOME/config.yaml.
#
# The agent runs in single-query mode (`hermes chat -q "<prompt>"`),
# loads the `collect-swiss-quantum-signals` skill, and emits a JSON
# block on stdout. A wrapper script then parses the JSON and upserts
# the signals into Supabase as system='hermes'.
#
# Why these knobs were chosen — see docs/iterations/v0.4.4-real-hermes-agent.md

model:
  # v0.4.38 — both systems migrated to Nemotron 3 Ultra 550B (:free).
  # Frontier-class MoE reasoning model on OpenRouter's free tier (550 B
  # total / 55 B active per token). Free-only policy from v0.4.8 is
  # preserved. Override with $HERMES_MODEL at runtime;
  # collect_all_actors.sh also reads $HERMES_MODEL_FALLBACK for an L3
  # per-actor retry when this returns signals: [] or errors.
  #
  # Reasoning-token handling: this CLI's upstream may or may not forward
  # an arbitrary `reasoning` / `extra_body` field to OpenRouter (the
  # schema is opaque to us). We rely on the THREE-LAYER defence:
  #   L1 — server-side, configured here best-effort below (`reasoning:
  #        exclude: true`) AND via the agent.reasoning_effort knob.
  #   L2 — client-side, persist_signals.py strips <think|thinking|
  #        reasoning|thought|analysis|scratchpad> blocks from agent
  #        stdout before JSON extraction. Always runs.
  #   L3 — model-level, collect_all_actors.sh retries with
  #        $HERMES_MODEL_FALLBACK on empty / error.
  default: "nvidia/nemotron-3-ultra-550b-a55b:free"
  provider: "openrouter"
  base_url: "https://openrouter.ai/api/v1"

  # Cap output per turn. Without this the agent asks for the model's
  # native ceiling, and OpenRouter requires enough credit balance to
  # pre-authorize the WHOLE max_tokens hold. 6144 leaves headroom for
  # the JSON output even if a stray bit of reasoning gets through.
  max_tokens: 6144

  # Total context window. Must be >= 64000 (Hermes Agent's hard floor).
  # Nemotron 3 Ultra's native window comfortably exceeds 64k; we cap at
  # 64k to keep credit-hold reservations low and trigger compression
  # sooner. Bump if the agent starts hitting compression every actor.
  context_length: 65536

  # v0.4.38 — server-side reasoning-token suppression. OpenRouter
  # honours `reasoning: {exclude: true}` as a top-level body field;
  # whether the upstream Hermes CLI forwards it from this YAML key
  # depends on its schema. If ignored, L2 (persist_signals.py) catches
  # the residual case. Documented at:
  #   https://openrouter.ai/docs/use-cases/reasoning-tokens
  reasoning:
    exclude: true

# ── FREE-ONLY POLICY (v0.4.8) ────────────────────────────────────────────
# The thesis runs on free-tier LLMs only. Without explicit overrides the
# upstream agent's auxiliary paths default to `provider: "auto"` and can
# silently route to PAID endpoints (Gemini-Flash via OpenRouter, native
# Claude, etc.). v0.4.7 capped the main turn; v0.4.8 pins every aux path
# to a known-free `:free` slug so a hot session can't quietly burn credit.
auxiliary:
  # vision_analyze + browser-screenshot analysis. Our skill doesn't use
  # images, but the agent might call it as a "what do you see here" probe
  # when a page fails to text-extract. Pin to a free vision-capable model.
  vision:
    provider: "openrouter"
    model: "meta-llama/llama-3.3-70b-instruct:free"
    timeout: 30
    download_timeout: 30

  # web_extract LLM summarisation (post-fetch summarisation of long pages).
  # This fires every time the agent uses `web_extract` — so probably the
  # path Anna's first big run was charged on.
  web_extract:
    provider: "openrouter"
    model: "meta-llama/llama-3.3-70b-instruct:free"

  # Session search summarisation. We don't use sessions across runs, but
  # pin anyway so future regressions can't accidentally bill against it.
  session_search:
    provider: "openrouter"
    model: "meta-llama/llama-3.3-70b-instruct:free"
    timeout: 30
    max_concurrency: 2

  # Context-compression summarisation. Triggers when conversation crosses
  # `compression.threshold` (50% of context_length = 16k tokens). Without
  # an explicit free model here, the auto-router can pick Gemini-Flash
  # (paid on OpenRouter).
  compression:
    provider: "openrouter"
    model: "meta-llama/llama-3.3-70b-instruct:free"

# Force OpenRouter to keep requests inside endpoints that support the
# parameters we send (max_tokens, tools), so requests don't silently
# downgrade to a non-tool-capable endpoint.
#
# v0.4.11 NOTE — we previously set `data_collection: "deny"` here for
# privacy. Removed because almost every OpenRouter `:free` model is free
# precisely because the provider trains on prompts. With deny set, every
# request 404s with "No endpoints found matching your data policy."
# Our prompts contain only public data (actor names from data/raw/actors.yaml,
# skill text from this repo, web-search results from the public internet),
# so opting into the free-model-training pool is acceptable. Anna's
# OpenRouter account-level privacy setting still applies as the final
# control surface (https://openrouter.ai/settings/privacy).
provider_routing:
  require_parameters: true

# Cron-safe behaviour — no chatter, no auto-update prompts, no banner.
display:
  compact: true
  tool_progress: "off"
  bell_on_complete: false
  show_reasoning: false
  streaming: false

# Memory carries across runs (the agent's "self-improving" pitch).
# It lives under /opt/data/memory inside the container — bind-mounted
# to ./systems/hermes/state/ on the host so it survives image
# rebuilds and is git-ignored.
memory:
  memory_enabled: true
  user_profile_enabled: false   # we are not a user, we are a cron job

# Tool surface — minimum needed for web research. No terminal, no
# browser automation (Playwright is huge), no image generation.
platform_toolsets:
  cli: [web, skills]

# Guardrails for an unattended cron run: hard-stop if the model loops.
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 3
    same_tool_failure: 5
    idempotent_no_progress: 3

agent:
  max_turns: 30        # ≤ 30 tool calls per actor — generous but capped
  reasoning_effort: "low"  # signal-collection is more search than reasoning

# Context compression — long search histories shouldn't blow the budget.
compression:
  enabled: true
  threshold: 0.50
  target_ratio: 0.20
