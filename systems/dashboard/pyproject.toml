[project]
name = "dashboard_app"
version = "0.1.0"
description = "Streamlit dashboard for the BSc thesis comparative MAS — signals, knowledge graph, reports browser. Read-only against Supabase."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40.0",
    "supabase>=2.7.0",
    "pandas>=2.2.0",
    "networkx>=3.3",
    "pyvis>=0.3.2",
    "altair>=5.4.0",
    "python-dateutil>=2.9.0",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dashboard_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
