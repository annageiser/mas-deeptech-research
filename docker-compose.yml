# Docker Compose stack for the BSc-thesis comparative MAS (Anna Geiser, FHNW).
#
# Seven containers, one VPS, one Supabase:
#   A — masfactory : System A scrape (cron-driven, exits after each run)
#   B — hermes     : System B scrape (cron-driven, exits after each run)
#   C — reports    : daily + weekly markdown synthesis (cron-driven)
#   F — api        : FastAPI JSON service over Supabase (always up)
#   G — web        : Next.js frontend (always up)
#   E — caddy      : TLS reverse proxy on :80/:443 → web, /api/* → api
#   D — dashboard  : legacy Streamlit UI on :8501 (kept during transition;
#                    no longer reachable via the domain — remove once `web`
#                    is proven)

services:
  masfactory:
    build:
      context: ./systems/masfactory
      dockerfile: Dockerfile
    image: mas-deeptech-research/masfactory:0.1.0
    container_name: masfactory-system-a
    restart: "no"
    env_file: [.env]
    environment:
      MASF_AUDIT_DIR: /data/raw/runs
      TZ: Europe/Zurich
    volumes:
      - ./data:/data
    command: ["run-once"]

  hermes:
    build:
      context: ./systems/hermes
      dockerfile: Dockerfile
    image: mas-deeptech-research/hermes:0.1.0
    container_name: hermes-system-b
    restart: "no"
    env_file: [.env]
    environment:
      HRM_AUDIT_DIR: /data/raw/runs
      HRM_SKILLS_DIR: /app/skills
      HRM_MEMORY_PATH: /data/raw/hermes_memory.sqlite
      HRM_WEB_CACHE_DIR: /data/raw/hermes_web_cache
      TZ: Europe/Zurich
    volumes:
      - ./data:/data
    command: ["run-once"]

  reports:
    build:
      context: ./systems/reports
      dockerfile: Dockerfile
    image: mas-deeptech-research/reports:0.1.0
    container_name: reports-container-c
    restart: "no"
    env_file: [.env]
    environment:
      RPT_REPORTS_DIR: /data/reports
      RPT_REPO_DIR: /repo
      RPT_THESIS_NOTES_PATH: /data/raw/thesis_notes.md
      TZ: Europe/Zurich
    volumes:
      - ./data:/data
      - .:/repo:ro
    command: ["build-check"]

  api:
    build:
      context: .
      dockerfile: systems/api/Dockerfile
    image: mas-deeptech-research/api:0.1.0
    container_name: api-container-f
    restart: unless-stopped
    env_file: [.env]
    environment:
      API_REPORTS_DIR: /data/reports
      API_SCHEMA_PATH: /app/schema.yaml
      API_CORS_ORIGINS: "*"
      TZ: Europe/Zurich
    volumes:
      - ./data:/data:ro
    expose:
      - "8000"

  web:
    build:
      context: ./systems/web
      dockerfile: Dockerfile
    image: mas-deeptech-research/web:0.1.0
    container_name: web-container-g
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api-container-f:8000
      TZ: Europe/Zurich
    depends_on:
      - api
    expose:
      - "3000"

  caddy:
    image: caddy:2.10-alpine
    container_name: caddy-container-e
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      TZ: Europe/Zurich
    depends_on:
      - web
      - api

  # Legacy Streamlit dashboard — kept reachable on :8501 during the cutover,
  # no longer wired to the domain. Remove this service once `web` is proven.
  dashboard:
    build:
      context: ./systems/dashboard
      dockerfile: Dockerfile
    image: mas-deeptech-research/dashboard:0.1.0
    container_name: dashboard-container-d
    restart: unless-stopped
    env_file: [.env]
    environment:
      DASH_REPORTS_DIR: /data/reports
      TZ: Europe/Zurich
    volumes:
      - ./data:/data:ro
    ports:
      - "8501:8501"

volumes:
  caddy_data:
  caddy_config:
