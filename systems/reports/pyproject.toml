[project]
name = "reports_system"
version = "0.1.0"
description = "Shared report generator — daily + weekly reports for System A, System B, and thesis progress. Reads Supabase (signals + runs + tokens) and the git repo; synthesises via OpenRouter; writes markdown to data/reports/."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50.0",
    "supabase>=2.7.0",
    "tenacity>=8.2.0",
    "pyyaml>=6.0.2",
    "python-dateutil>=2.9.0",
    # v0.4.3 — industry_news_runner reads RSS feeds via feedparser + httpx
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
]

[project.scripts]
reports-run = "reports_system.runner:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["reports_system*"]

[tool.setuptools.package-data]
reports_system = ["../prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
