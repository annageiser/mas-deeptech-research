# Docker Compose stack for the BSc-thesis comparative MAS (Anna Geiser, FHNW).
#
# Seven containers, one VPS, one Supabase:
#   A — masfactory : System A scrape (cron-driven, exits after each run)
#   B — hermes     : System B scrape (cron-driven, exits after each run)
#   C — reports    : daily + weekly markdown synthesis (cron-driven)
#   F — api        : FastAPI JSON service over Supabase (always up)
#   G — web        : Next.js frontend (always up)
#   E — caddy      : TLS reverse proxy on :80/:443 → web, /api/* → api
#   D — dashboard  : legacy Streamlit UI on :8501 (kept during transition;
#                    no longer reachable via the domain — removed once `web`
#                    was proven)

services:
  masfactory:
    build:
      context: ./systems/masfactory
      dockerfile: Dockerfile
    image: mas-deeptech-research/masfactory:0.1.0
    container_name: masfactory-system-a
    restart: "no"
    env_file: [.env]
    environment:
      MASF_AUDIT_DIR: /data/raw/runs
      TZ: Europe/Zurich
    volumes:
      - ./data:/data
    command: ["run-once"]

  # System B — real NousResearch hermes-agent CLI (v0.16.0, pinned via
  # the systems/hermes/upstream git submodule). The earlier pattern
  # implementation (single AIAgent loop in pure Python) was retired on
  # 2026-06-10 in favour of the upstream CLI driven by a Swiss-quantum
  # collection skill. Historical signals tagged system='hermes' from the
  # pattern era remain in Supabase untouched — the new agent inherits
  # the same `system='hermes'` namespace.
  #
  # Build prerequisite (10-15 min, ~1.5 GB) — run once before first deploy:
  #     docker build -t hermes-upstream:local systems/hermes/upstream
  # Then `docker compose build hermes` builds the thin wrapper.
  hermes:
    build:
      context: ./systems/hermes
      dockerfile: Dockerfile
      # v0.4.20: no longer needs UPSTREAM_TAG. Dockerfile pulls the
      # official published image from Docker Hub (digest-pinned).
    image: mas-deeptech-research/hermes:0.4.0
    container_name: hermes-system-b
    restart: "no"
    env_file: [.env]
    environment:
      # System B uses the shared OPENROUTER_API_KEY (the 1000-req/day key)
      # inherited from env_file. The per-system OPENROUTER_API_KEY_SYSTEM_B
      # override was reverted: the dedicated key was on the 50-req/day free
      # tier, which 429-starved every hermes run into signals: [] (both
      # systems zero-signal on 2026-07-07). Both systems now share the
      # 1000/day key again. See docs/iterations/v0.4.44-revert-system-b-key-split.md.
      HERMES_HOME: /opt/data
      # v0.4.36: pass the actual built image tag into the persister so
      # runs.config_snapshot.image records reality instead of the v0.2.1
      # placeholder that persist_signals.py used to hardcode. Reproducibility
      # leg of §3.5.4 depends on this — audit-row replay needs to know which
      # image actually ran.
      HERMES_IMAGE_TAG: mas-deeptech-research/hermes:0.4.0
      # v0.4.20: HRM_EMBEDDINGS=1 enables the 768d BGE embedding pass in
      # persist_signals.py (same model + composition as MASFactory's
      # MASF_EMBEDDINGS, so cross-system signals embed to nearby points).
      # Prereq for M.1 (semantic dedup) being meaningful for B.
      HRM_EMBEDDINGS: ${HRM_EMBEDDINGS:-}
      # v0.4.24: HRM_SENTIMENT (default ON; set to 0/false/no/off to skip
      # VADER scoring). Same lexicon + thresholds as MASFactory's MASF_SENTIMENT.
      HRM_SENTIMENT: ${HRM_SENTIMENT:-}
      # Smoke-test knobs: `HERMES_LIMIT_ACTORS=3 HERMES_LOOKBACK_DAYS=60
      # docker compose run --rm hermes`. Default = all 40 actors, 180-day window.
      # Compose only forwards shell env when it appears in this block — that's
      # why `HERMES_LIMIT_ACTORS=3 docker compose run …` was silently ignored
      # before v0.4.5 (see docs/iterations/v0.4.5-...).
      HERMES_LIMIT_ACTORS: ${HERMES_LIMIT_ACTORS:-}
      HERMES_LOOKBACK_DAYS: ${HERMES_LOOKBACK_DAYS:-180}
      # v0.4.30: model override now actually reaches the container.
      # Without this passthrough, HERMES_MODEL=... on docker compose run
      # was set in the HOST shell but never propagated into the wrapper —
      # the container kept using the script default. The default itself
      # changed in v0.4.30 from Nemotron-Super-120B (reasoning model whose
      # <think> output Hermes can't unwrap → empty visible response →
      # signals: [] every run) to Llama-3.3-70B-instruct (plain instruct
      # model). To swap, set HERMES_MODEL in .env.
      HERMES_MODEL: ${HERMES_MODEL:-}
      # ── Web-search backend ───────────────────────────────────────────────
      # v0.5.0 Stage 2: System B's web_search now runs on the shared
      # self-hosted SearXNG service (cli-config.yaml sets
      # web.search_backend=searxng; this URL activates the built-in searxng
      # provider — plugins/web/searxng). Free, no API key, no quota. Internal
      # default points at the compose service; override in .env only to use an
      # external instance. The paid/other keys below stay wired but inactive
      # (blank in .env). web_extract remains search-only until the scrapling
      # skill lands (Stage 2b). See docs/iterations/v0.5.0-...
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      FIRECRAWL_API_URL: ${FIRECRAWL_API_URL:-}
      PARALLEL_API_KEY: ${PARALLEL_API_KEY:-}
      TZ: Europe/Zurich
    volumes:
      - ./data:/data
      - hermes_state:/opt/data
    # v0.5.0 Stage 2: ensure the shared SearXNG substrate is up + healthy
    # before a run starts. The cron `docker compose run --rm hermes` honours
    # this and waits; the `--no-deps` smoke path skips it and assumes searxng
    # is already running.
    depends_on:
      searxng:
        condition: service_healthy
    # Default CMD in the Dockerfile runs collect_all_actors.sh.
    # Override for interactive debugging:
    #   docker compose run --rm hermes \
    #       hermes chat --skills collect-swiss-quantum-signals

  reports:
    build:
      context: ./systems/reports
      dockerfile: Dockerfile
    image: mas-deeptech-research/reports:0.1.0
    container_name: reports-container-c
    restart: "no"
    env_file: [.env]
    environment:
      RPT_REPORTS_DIR: /data/reports
      RPT_REPO_DIR: /repo
      RPT_THESIS_NOTES_PATH: /data/raw/thesis_notes.md
      TZ: Europe/Zurich
    volumes:
      - ./data:/data
      - .:/repo:ro
    command: ["build-check"]

  api:
    build:
      context: .
      dockerfile: systems/api/Dockerfile
    image: mas-deeptech-research/api:0.1.0
    container_name: api-container-f
    restart: unless-stopped
    env_file: [.env]
    environment:
      API_REPORTS_DIR: /data/reports
      API_SCHEMA_PATH: /app/schema.yaml
      API_CORS_ORIGINS: "*"
      TZ: Europe/Zurich
    volumes:
      - ./data:/data:ro
    expose:
      - "8000"

  web:
    build:
      context: ./systems/web
      dockerfile: Dockerfile
    image: mas-deeptech-research/web:0.1.0
    container_name: web-container-g
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api-container-f:8000
      TZ: Europe/Zurich
    depends_on:
      - api
    expose:
      - "3000"

  caddy:
    image: caddy:2.10-alpine
    container_name: caddy-container-e
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      TZ: Europe/Zurich
    depends_on:
      - web
      - api

  # v0.4.25 — Phoenix observability (Arize). Off by default at runtime
  # because it adds per-call overhead and the thesis evaluation chapter
  # only needs traces for a handful of representative runs.
  #
  # Behind a compose PROFILE so `docker compose up -d` skips it. To
  # start it explicitly:
  #   docker compose --profile observability up -d phoenix
  #
  # Then to capture traces for a single run:
  #   PHOENIX_ENABLED=1 docker compose run --rm masfactory run-once --limit-actors 3
  #
  # UI is on :6006 inside the compose network. NOT routed through Caddy
  # by default — exposed to host on 127.0.0.1:6006 so you can reach it
  # via SSH tunnel without making it world-readable:
  #   ssh -L 6006:127.0.0.1:6006 root@<vps>
  #   open http://localhost:6006 in your browser
  #
  # If you want public access later, add a Caddy reverse-proxy block
  # (matched on a subdomain or sub-path with basicauth) — same pattern
  # as the main site.
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: mas-phoenix
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      # Phoenix listens on 6006 (UI + OTLP) by default.
      PHOENIX_PORT: 6006
    volumes:
      - phoenix_data:/mnt/data
    ports:
      - "127.0.0.1:6006:6006"

  # H — searxng : shared self-hosted meta-search substrate for BOTH System A
  #     and System B (v0.5.0). Aggregates general-web + academic engines
  #     (arXiv, Scholar, Semantic Scholar, OpenAlex, PubMed, Crossref) behind
  #     one JSON API — free, no API key, no monthly quota, and reproducible
  #     (pinned image + committed settings.yml). NOTE: SearXNG has no patents
  #     engine — patents stay a System-A/EPO-OPS channel (see settings.yml).
  #     Replaces the per-system Tavily/ddgs substrate so the A-vs-B comparison
  #     isolates architecture, not search source. INTERNAL ONLY: no published
  #     ports; reached at http://searxng:8080 on the compose network by the two
  #     scrapers. See docs/iterations/v0.5.0-reference-architecture-retrieval.md.
  searxng:
    # Pinned to a digest for reproducibility (R6). Re-pin after an intentional
    # upgrade: `docker compose pull searxng && docker inspect --format '{{index .RepoDigests 0}}' searxng/searxng:latest`.
    image: searxng/searxng@sha256:02aa607ecc87165ebe6212476a176b8984d891c01a2d130ad03a58109d13db77
    container_name: searxng-shared
    restart: unless-stopped
    environment:
      # Base URL is only used to build absolute links in results; internal name
      # is fine for headless API use.
      SEARXNG_BASE_URL: http://searxng:8080/
      TZ: Europe/Zurich
    volumes:
      - ./searxng:/etc/searxng:rw
    # Health via SearXNG's /healthz (busybox wget ships in the image). Lets the
    # Stage-2/3 consumers gate on `depends_on: {searxng: {condition:
    # service_healthy}}` so a cron tick can't run before search is ready.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # No `ports:` — this instance is internal to the compose network only.

  # Legacy Streamlit dashboard — kept reachable on :8501 during the cutover,
  # no longer wired to the domain. Remove this service once `web` is proven.
  # dashboard:
  #   build:
  #     context: ./systems/dashboard
  #     dockerfile: Dockerfile
  #   image: mas-deeptech-research/dashboard:0.1.0
  #   container_name: dashboard-container-d
  #   restart: unless-stopped
  #   env_file: [.env]
  #   environment:
  #     DASH_REPORTS_DIR: /data/reports
  #     TZ: Europe/Zurich
  #   volumes:
  #     - ./data:/data:ro
  #   ports:
  #     - "8501:8501"

volumes:
  caddy_data:
  caddy_config:
  # Hermes agent's persistent state (memory + per-run trajectory logs).
  # Named volume rather than bind-mount so the upstream image's UID remap
  # (HERMES_UID=10000) doesn't fight host ownership semantics.
  hermes_state:
  # v0.4.25 — Phoenix SQLite database (traces survive container restarts).
  phoenix_data:
